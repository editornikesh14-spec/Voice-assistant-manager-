            display: flex;

        .status-dot.sleeping {

        .status-dot.processing {

        .status-dot.speaking {
            background: #9b59b6;
            box-shadow: 0 0 12px #9b59b6;
            animation: pulse-speaking 1s infinite alternate;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.8; }

        @keyframes pulse-sleeping {

        .empty-log {

            font-size: 14px;

        /* Type manual command row */
        .type-row {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }
        .type-input {
            flex: 1;

            background: #131a24;
            border: 1px solid #2d3546;

            color: #eef2f8;
            font-size: 14px;

        }
        .type-input:focus {
            border-color: #2d9cdb;
        }
        .type-send-btn {

            border-radius: 12px;
            color: #eef2f8;

            background: #2d9cdb;

            border-top: 1px solid #242c3d;

        .settings-summary {

        .range-slider {
            accent-color: #2d9cdb;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }

                <select class="lang-select" id="voiceSelect" style="width: 100%;"><option value="">Default Browser Voice</option><option value="0">⭐ Assamese India (as_IN) — DEFAULT</option><option value="1">Bulgarian Bulgaria (bg_BG)</option><option value="2">Bangla Bangladesh (bn_BD)</option><option value="3">⭐ Bangla India (bn_IN)</option><option value="4">⭐ Bodo India (brx_IN)</option><option value="5">Bosnian Bosnia &amp; Herzegovina (bs_BA_#Cyrl)</option><option value="6">Bosnian Bosnia &amp; Herzegovina (bs_BA_#Latn)</option><option value="7">Catalan Spain (ca_ES)</option><option value="8">Czech Czechia (cs_CZ)</option><option value="9">Welsh United Kingdom (cy_GB)</option><option value="10">Danish Denmark (da_DK)</option><option value="11">German Germany (de_DE)</option><option value="12">⭐ Dogri India (doi_IN)</option><option value="13">Greek Greece (el_GR)</option><option value="14">English Australia (en_AU)</option><option value="15">English United Kingdom (en_GB)</option><option value="16">⭐ English India (en_IN)</option><option value="17">English Nigeria (en_NG)</option><option value="18">English United States (en_US)</option><option value="19">Spanish Spain (es_ES)</option><option value="20">Spanish United States (es_US)</option><option value="21">Estonian Estonia (et_EE)</option><option value="22">Finnish Finland (fi_FI)</option><option value="23">Filipino Philippines (fil_PH)</option><option value="24">French Canada (fr_CA)</option><option value="25">French France (fr_FR)</option><option value="26">⭐ Gujarati India (gu_IN)</option><option value="27">Hebrew Israel (iw_IL)</option><option value="28">⭐ Hindi India (hi_IN)</option><option value="29">Croatian Croatia (hr_HR)</option><option value="30">Hungarian Hungary (hu_HU)</option><option value="31">Indonesian Indonesia (in_ID)</option><option value="32">Icelandic Iceland (is_IS)</option><option value="33">Italian Italy (it_IT)</option><option value="34">Japanese Japan (ja_JP)</option><option value="3 on value="73">Thai Thailand (th_TH)</option><option value="74">Turkish Turkey (tr_TR)</option><option value="75">Ukrainian Ukraine (uk_UA)</option><option value="76">⭐ Urdu India (ur_IN)</option><option value="77">Urdu Pakistan (ur_PK)</option><option value="78">Vietnamese Vietnam (vi_VN)</option><option value="79">Cantonese Hong Kong (yue_HK_#Hant)</option><option value="80">Chinese China (zh_CN_#Hans)</option><option value="81">Chinese Hong Kong (zh_HK_#Hans)</option><option value="82">Chinese Macao (zh_MO_#Hans)</option><option value="83">Chinese Singapore (zh_SG_#Hans)</option><option value="84">Chinese Hong Kong (zh_HK_#Hant)</option><option value="85">Chinese Macao (zh_MO_#Hant)</option><option value="86">Chinese Taiwan (zh_TW_#Hant)</option></select>
            </div>
        </div>
    </details>

    <div class="footnote">
        <span>🔹 Chrome / Edge recommended</span>
        <span>•</span>
        <span>🎙️ Web Speech API</span>
        <span>•</span>
        <span>🤖 Powered by Google Gemini</span>
    </div>
</div>

<script>
    // ---------- DOM Elements ----------
    const apiKeyInput = document.getElementById('apiKey');
    const toggleApiKeyBtn = document.getElementById('toggleApiKeyBtn');
    const serverKeyBadge = document.getElementById('serverKeyBadge');
    const wakeWordInput = document.getElementById('wakeWord');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const wavesContainer = document.getElementById('wavesContainer');
    const logDiv = document.getElementById('log');
    const clearLogBtn = document.getElementById('clearLogBtn');
    const langSelect = document.getElementById('langSelect');
    const textCommandInput = document.getElementById('textCommandInput');
    const textSendBtn = document.getElementById('textSendBtn');
    const sampleChips = document.getElementById('sampleChips');
    const voiceRate = document.getElementById('voiceRate');
    const voicePitch = document.getElementById('voicePitch');
    const rateVal = document.getElementById('rateVal');
    const pitchVal = document.getElementById('pitchVal');
    const voiceSelect = document.getElementById('voiceSelect');

    let recognition = null;
    let isRunning = false;
    let state = 'sleeping'; // 'sleeping' | 'listening' | 'processing' | 'speaking'
    let wakeWord = 'jarvis';
    let availableVoices = [];
    let audioCtx = null;
    let hasServerKey = false;

    // ---------- Speech APIs ----------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    // Check server key availability on load
    async function checkServerStatus() {
        try {
            const res = await fetch('/api/status');
            if (res.ok) {
                const data = await res.json();
                if (data.hasApiKey) {
                    hasServerKey = true;
                    if (serverKeyBadge) serverKeyBadge.style.display = 'inline-flex';
                    apiKeyInput.placeholder = '✓ Server Gemini Key connected (or paste custom key)';
                }
            }
        } catch (e) {
            // Offline or standalone file mode
        }
    }
    checkServerStatus();

    // Populate Speech Synthesis Voices
    function populateVoices() {
        if (!synth) return;
        availableVoices = synth.getVoices();
        voiceSelect.innerHTML = '<option value="">Default Browser Voice</option>';

        // Prioritize Hindi and Indian English
        availableVoices.forEach((voice, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${voice.name} (${voice.lang})${voice.default ? ' — DEFAULT' : ''}`;
            if (voice.lang.includes('hi') || voice.lang.includes('IN')) {
                opt.textContent = `⭐ ${opt.textContent}`;
            }
            voiceSelect.appendChild(opt);
        });

        // Select a Hindi or Indian voice if available
        const preferredIdx = availableVoices.findIndex(v => v.lang.includes('hi-IN') || v.lang.includes('en-IN'));
        if (preferredIdx >= 0) {
            voiceSelect.value = preferredIdx;
        }
    }
    if (synth) {
        populateVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoices;
        }
    }

    // ---------- Sound Feedback (Web Audio API) ----------
    function playChime(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'wake') {
                // Two-tone rising chime: "Ding-ding"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, now); // E5
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            }
        } catch (e) {
            // Silently ignore audio context autoplay policy blocks
        }
    }

    // ---------- Text to Speech ----------
    function speak(text) {
        if (!synth) {
            addLog('assistant', text);
            return;
        }
        synth.cancel();

        const utter = new SpeechSynthesisUtterance(text);
        const selectedIdx = voiceSelect.value;
        if (selectedIdx !== '' && availableVoices[selectedIdx]) {
            utter.voice = availableVoices[selectedIdx];
        }
        utter.lang = langSelect.value || 'hi-IN';
        utter.rate = parseFloat(voiceRate.value) || 1.0;
        utter.pitch = parseFloat(voicePitch.value) || 1.0;

        utter.onstart = () => {
            state = 'speaking';
            setStatus('🗣️ Bol raha hu...', 'speaking');
            setWaves(true);
        };

        utter.onend = () => {
            setWaves(false);
            if (isRunning) {
                state = 'sleeping';
                setStatus(`🎤 Sun raha hu... ("${wakeWord}" bolo)`, 'sleeping');
            } else {
                state = 'idle';
                setStatus('⏹️ Stopped', '');
            }
        };

        utter.onerror = () => {
            setWaves(false);
            if (isRunning) {
                state = 'sleeping';
                setStatus(`🎤 Sun raha hu... ("${wakeWord}" bolo)`, 'sleeping');
            }
        };

        addLog('assistant', text);
        synth.speak(utter);
    }

    // ---------- UI Log Management ----------
    function addLog(type, text) {
        const empty = logDiv.querySelector('.empty-log');
        if (empty) empty.remove();

        const div = document.createElement('div');
        div.className = `msg msg-${type}`;

        if (type === 'assistant') {
            div.innerHTML = `
                <div><strong>🤖 Assistant:</strong> <span>${escapeHtml(text)}</span></div>
                <div class="msg-actions">
                    <button class="action-chip" onclick="speakAgain('${encodeURIComponent(text)}')">🔊 Speak again</button>
                    <button class="action-chip" onclick="copyText('${encodeURIComponent(text)}')">📋 Copy</button>
                </div>
            `;
        } else {
            div.innerHTML = `<div><strong>🧑 You:</strong> <span>${escapeHtml(text)}</span></div>`;
        }

        logDiv.appendChild(div);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    window.speakAgain = function(encodedText) {
        const text = decodeURIComponent(encodedText);
        speak(text);
    };

    window.copyText = function(encodedText) {
        const text = decodeURIComponent(encodedText);
        navigator.clipboard.writeText(text).then(() => {
            setStatus('📋 Copied to clipboard!', 'active');
            setTimeout(() => {
                if (isRunning) setStatus(`🎤 Sun raha hu... ("${wakeWord}" bolo)`, 'sleeping');
                else setStatus('⏹️ Stopped', '');
            }, 1200);
        });
    };

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function setStatus(text, dotState) {
        statusText.textContent = text;
        statusDot.className = 'status-dot';
        if (dotState) {
            statusDot.classList.add(dotState);
        }
    }

    function setWaves(active) {
        if (active) {
            wavesContainer.classList.add('waves-animating');
        } else {
            wavesContainer.classList.remove('waves-animating');
        }
    }

    // ---------- Gemini AI Request Engine ----------
    async function askGemini(prompt) {
        const userKey = apiKeyInput.value.trim();

        // 1. Try server-side proxy route first
        try {
            const serverRes = await fetch('/api/gemini', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: prompt,
                    apiKey: userKey || undefined
                })
            });

            if (serverRes.ok) {
                const data = await serverRes.json();
                if (data.text) return data.text;
            }
        } catch (serverErr) {
            // Server proxy unavailable (e.g. running from downloaded static file)
        }

        // 2. Direct client-side Gemini fallback (works for downloaded HTML or direct key)
        const activeKey = userKey;
        if (!activeKey) {
            speak('Kripya pehle Gemini API key daaliye ya configure kijiye.');
            return null;
        }

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(activeKey)}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: {
                        parts: [{
                            text: 'You are Jarvis, a smart, polite, and helpful AI voice assistant. Respond in conversational Hindi / Hinglish or English based on the language of the user. Keep responses clear, polite, and brief (1 to 3 sentences) so they sound natural when spoken aloud via text-to-speech. Avoid markdown symbols like asterisks, bullet lists, or code blocks unless requested.'
                        }]
                    }
                })
            });

            if (!res.ok) {
                const errData = await res.text();
                throw new Error(`API error ${res.status}: ${errData}`);
            }

            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Empty response from Gemini');
            return text;
        } catch (err) {
            console.error('Gemini error:', err);
            return `Maaf kijiye, error aaya: ${err.message || 'Check your API key.'}`;
        }
    }

    // ---------- Speech Recognition Logic ----------
    function initRecognition() {
        if (!SpeechRecognition) {
            alert('❌ Aapka browser Speech Recognition support nahi karta. Kripya Google Chrome ya Microsoft Edge browser use karein.');
            return false;
        }

        recognition = new SpeechRecognition();
        recognition.lang = langSelect.value || 'hi-IN';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            state = 'sleeping';
            setStatus(`🎤 Sun raha hu... ("${wakeWord}" bolo)`, 'sleeping');
            setWaves(false);
        };

        recognition.onerror = (e) => {
            if (e.error === 'not-allowed') {
                setStatus('❌ Microphone permission denied', '');
                alert('Microphone permission block ho gaya hai. Browser settings mein mic allow karein.');
                stopAssistant();
            } else if (e.error === 'no-speech') {
                // Background silence, keep going
            } else {
                console.warn('Recognition warning:', e.error);
            }
        };

        recognition.onend = () => {
            if (isRunning) {
                try {
                    recognition.lang = langSelect.value || 'hi-IN';
                    recognition.start();
                } catch (err) {
                    setTimeout(() => {
                        if (isRunning) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 400);
                }
            } else {
                setStatus('⏹️ Stopped', '');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setWaves(false);
            }
        };

        recognition.onresult = async (event) => {
            let final = '';
            let interim = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                const transcript = result[0].transcript.toLowerCase().trim();
                if (result.isFinal) {
                    final += transcript + ' ';
                } else {
                    interim += transcript + ' ';
                }
            }

            if (final.trim() !== '') {
                await processCommand(final.trim());
            }
        };

        return true;
    }

    // Process spoken text against Wake Word and state
    async function processCommand(text) {
        const ww = wakeWordInput.value.trim().toLowerCase() || 'jarvis';

        if (state === 'sleeping') {
            if (text.includes(ww)) {
                playChime('wake');
                let idx = text.indexOf(ww);
                let command = text.substring(idx + ww.length).trim();

                if (command.length > 1) {
                    // Wake word + command in one sentence
                    state = 'processing';
                    setStatus('🧠 Soch raha hu...', 'processing');
                    setWaves(false);
                    addLog('user', command);
                    const response = await askGemini(command);
                    if (response) speak(response);
                } else {
                    // Just the wake word
                    state = 'listening';
                    setStatus('👂 Sun raha hu... boliye!', 'active');
                    setWaves(true);
                    playChime('beep');
                    speak('Ji, boliye?');
                }
            }
        } else if (state === 'listening') {
            state = 'processing';
            setStatus('🧠 Soch raha hu...', 'processing');
            setWaves(false);
            addLog('user', text);
            const response = await askGemini(text);
            if (response) speak(response);
        }
    }

    // Trigger manual command (via chip or text input)
    async function executeManualCommand(commandText) {
        if (!commandText || !commandText.trim()) return;
        addLog('user', commandText);
        state = 'processing';
        setStatus('🧠 Soch raha hu...', 'processing');
        const response = await askGemini(commandText);
        if (response) {
            speak(response);
        } else {
            if (isRunning) {
                state = 'sleeping';
                setStatus(`🎤 Sun raha hu... ("${wakeWord}" bolo)`, 'sleeping');
            } else {
                state = 'idle';
                setStatus('⏹️ Stopped', '');
            }
        }
    }

    // ---------- Start / Stop Controls ----------
    function startAssistant() {
        const key = apiKeyInput.value.trim();
        if (!key && !hasServerKey) {
            const proceed = confirm('Aapne Gemini API key enter nahi ki hai. Kya aap pehle API key enter karna chahte hain?');
            if (proceed) {
                apiKeyInput.focus();
                return;
            }
        }

        if (!SpeechRecognition) {
            alert('❌ Aapka browser Speech Recognition support nahi karta. Chrome ya Edge use karein.');
            return;
        }

        wakeWord = wakeWordInput.value.trim().toLowerCase() || 'jarvis';

        if (!recognition) {
            if (!initRecognition()) return;
        } else {
            recognition.lang = langSelect.value || 'hi-IN';
        }

        try {
            recognition.start();
        } catch (e) {
            try {
                recognition.stop();
                setTimeout(() => {
                    try { recognition.start(); } catch (err) {}
                }, 300);
            } catch (err) {
                console.error(err);
            }
        }

        const empty = logDiv.querySelector('.empty-log');
        if (empty) empty.remove();
        addLog('assistant', `Namaste! Main taiyaar hu. "${wakeWord}" bol kar mujhse baat karein.`);
        playChime('wake');
    }

    function stopAssistant() {
        isRunning = false;
        if (recognition) {
            try { recognition.stop(); } catch (e) {}
        }
        state = 'idle';
        setStatus('⏹️ Stopped', '');
        startBtn.disabled = false;
        stopBtn.disabled = true;
        setWaves(false);
        if (synth) synth.cancel();
    }

    // ---------- Event Listeners ----------
    startBtn.addEventListener('click', startAssistant);
    stopBtn.addEventListener('click', stopAssistant);

    wakeWordInput.addEventListener('change', function() {
        wakeWord = this.value.trim().toLowerCase() || 'jarvis';
        if (state === 'sleeping' && isRunning) {
            setStatus(`🎤 Sun raha hu... ("${wakeWord}" bolo)`, 'sleeping');
        }
    });

    langSelect.addEventListener('change', function() {
        if (recognition) {
            recognition.lang = this.value;
        }
    });

    toggleApiKeyBtn.addEventListener('click', function() {
        if (apiKeyInput.type === 'password') {
            apiKeyInput.type = 'text';
            toggleApiKeyBtn.textContent = '🙈';
        } else {
            apiKeyInput.type = 'password';
            toggleApiKeyBtn.textContent = '👁️';
        }
    });

    clearLogBtn.addEventListener('click', function() {
        logDiv.innerHTML = '<div class="empty-log">💬 Conversation will appear here. Say your wake word or click Start!</div>';
        if (synth) synth.cancel();
    });

    // Slider controls
    voiceRate.addEventListener('input', function() {
        rateVal.textContent = `${this.value}x`;
    });
    voicePitch.addEventListener('input', function() {
        pitchVal.textContent = this.value;
    });

    // Manual input sending
    textSendBtn.addEventListener('click', () => {
        const text = textCommandInput.value.trim();
        if (text) {
            executeManualCommand(text);
            textCommandInput.value = '';
        }
    });
    textCommandInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const text = textCommandInput.value.trim();
            if (text) {
                executeManualCommand(text);
                textCommandInput.value = '';
            }
        }
    });

    // Sample chips
    sampleChips.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (chip && chip.dataset.prompt) {
            executeManualCommand(chip.dataset.prompt);
        }
    });

    // Download standalone HTML file
    downloadBtn.addEventListener('click', function() {
        // Clone document to prepare standalone file
        const docClone = document.documentElement.cloneNode(true);

        // Keep current API key if entered so the offline user has it ready
        const cloneKeyInput = docClone.querySelector('#apiKey');
        if (cloneKeyInput && apiKeyInput.value) {
            cloneKeyInput.setAttribute('value', apiKeyInput.value);
        }

        const cloneWakeInput = docClone.querySelector('#wakeWord');
        if (cloneWakeInput && wakeWordInput.value) {
            cloneWakeInput.setAttribute('value', wakeWordInput.value);
        }

        const htmlContent = '<!DOCTYPE html>\n' + docClone.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'voice-assistant.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // Cleanup when leaving
    window.addEventListener('beforeunload', function() {
        if (recognition) {
            try { recognition.stop(); } catch (e) {}
        }
        if (synth) synth.cancel();
    });
</script>
